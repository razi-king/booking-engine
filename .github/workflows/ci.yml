name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A real Postgres runs next to the job, so the contract tests and the
    # "exactly one winner" race test run against the real database on every push.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U booking"
          --health-interval 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://booking:booking@localhost:5432/booking_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go vet ./...
      - name: Test (race detector, real Postgres)
        run: go test -race -count=1 -p 1 -coverprofile=cover.out ./...
      - run: go tool cover -func=cover.out | tail -1
      - name: Benchmark (short)
        run: go test -run x -bench . -benchtime=3x ./internal/booking

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t booking-engine .
      - name: Smoke test (in-memory store)
        run: |
          docker run -d -p 8080:8080 --name api booking-engine
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs -X POST -H 'X-User-ID: ci' -d '{"flightId":1,"seats":["12A"]}' localhost:8080/api/v1/holds
